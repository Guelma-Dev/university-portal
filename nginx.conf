server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Serve static files directly (faster)
    location /css/ {
        alias /var/www/university-portal/css/;
        expires 7d;
    }
    location /js/ {
        alias /var/www/university-portal/js/;
        expires 7d;
    }
    location /assets/ {
        alias /var/www/university-portal/assets/;
        expires 30d;
    }
    location /files/ {
        alias /var/www/university-portal/backend/files/;
        expires 30d;
    }

    # Proxy Flask for API and everything else
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
