<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — كل أقسام جامعتي (قالمة)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/luxury.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/native.css">
<link rel="stylesheet" href="../css/campus.css?v=2">
<link rel="stylesheet" href="../css/nova.css">
<style>
    /* ---- preview chrome (not part of the app) ---- */
    html, body { margin: 0; }
    .pv-wrap { max-width: 560px; margin: 0 auto; padding-bottom: 120px; }
    .pv-note {
        margin: 18px 14px 0; padding: 14px 18px;
        color: #94A3B8; font-family: 'Tajawal', sans-serif; font-size: 13px; line-height: 1.8;
        background: #131927; border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
    }
    .pv-note b { color: #fff; }
    .pv-chips {
        display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 14px 4px;
        font-family: 'Tajawal', sans-serif;
    }
    .pv-chips button {
        border: 1px solid rgba(255,255,255,.12); background: #1A2234; color: #94A3B8;
        border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer;
    }
    .pv-chips button.on { background: linear-gradient(135deg, #3B82F6, #2563EB); color: #fff; border-color: transparent; }
    .pv-toggle {
        position: fixed; z-index: 99999; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px; border-radius: 999px;
        background: rgba(19,25,39,.92); border: 1px solid rgba(255,255,255,.12);
        box-shadow: 0 16px 40px rgba(0,0,0,.55); backdrop-filter: blur(14px);
        font-family: 'Tajawal', sans-serif;
    }
    .pv-toggle button {
        border: 0; cursor: pointer; padding: 9px 22px; border-radius: 999px;
        background: transparent; color: #94A3B8; font: inherit; font-weight: 800; font-size: 13px;
    }
    .pv-toggle button.on { background: linear-gradient(135deg, #3B82F6, #2563EB); color: #fff; }
    .pv-mode { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(59,130,246,.15); color: #93C5FD; }

    /* ================= BEFORE (legacy look) — scoped ================= */
    body.before .cx-card {
        background: #11151D !important;
        border: 1px solid #2B2B31 !important;
        border-radius: 12px !important;
        box-shadow: 0 6px 18px rgba(0,0,0,.38) !important;
        padding: 16px !important;
    }
    body.before .cx-room { border-bottom-color: #2B2B31 !important; }
    body.before .cx-pill.ok { background: rgba(76,175,135,.12); color: #4FB877; border-color: rgba(76,175,135,.28); }
    body.before .cx-pill.warn { background: rgba(59,130,246,.10); color: #2563EB; border-color: rgba(255,255,255,.08); }
    body.before .cx-pill.bad { background: rgba(255,112,112,.1); color: #E5484D; border-color: #E5484D; }
    body.before .cx-pill.info { background: rgba(96,165,250,.1); color: #60A5FA; border-color: #60A5FA; }
    body.before .cx-btn { border-color: #2B2B31; background: #1A2234; }
    body.before .cx-meter { background: #1A2234; }
    body.before .pm-c-blue { color: #2563eb; }
    body.before .pm-c-orange { color: #d97706; }
    body.before .pm-c-teal { color: #0d9488; }
    body.before .pm-c-purple { color: #7c3aed; }
    body.before .pm-tag.pink { background: #fde8ec; color: #d6336c; }
    body.before .pm-tag.teal { background: #ddf5f2; color: #0d9488; }
    body.before .pm-tag.gray { background: #eef1f6; color: #5b6478; }
    body.before .pm-news .pm-x { color: #6b7488; }
    body.before .pm-more { background: #e8effe; color: #1d4ed8; border-color: transparent; }
    body.before .pm-pager { color: #5b6478; }
    body.before .pm-pager button { background: #fff; border-color: #e4e9f2; color: #1d4ed8; }
    body.before .pm-roomhead { color: #1b2360; }
    body.before .pm-roomhead h3 { color: #1b2360; }
    body.before .pm-day { color: #1b2360; background: #fff; border-color: #e4e9f2; }
    body.before .pm-twrap { border-color: #e4e9f2; background: #fff; }
    body.before table.pm-rooms { background: #fff; }
    body.before table.pm-rooms tbody td { border-top-color: #eef1f6; color: #16213b; }
    body.before table.pm-rooms tbody td:first-child { background: #fff; }
    body.before .pm-cellok { background: #dcf5e5; color: #16a34a; }
    body.before .pm-cellbusy { background: #fde4e4; color: #dc2626; }
    body.before .cx-card h3, body.before .cx-card h4 { color: #F5F7FA; }
    body.before .cx-muted { color: #8A93A6; }

    /* services: legacy container */
    .dh-sv { border: 1px solid rgba(255,255,255,.1); border-radius: 0; }
    .dh-sv button {
        display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 13px 0; background: transparent; border: none;
        border-bottom: 1px solid #2B2B31; font-family: inherit; cursor: pointer; text-align: start;
        color: #94A3B8;
    }
    .dh-sv button:last-child { border-bottom: none; }
    .dh-sv button > span { flex: 1; min-width: 0; font-size: .87rem; font-weight: 700; }
    .dh-go { font-size: .64rem; color: #7A869E; opacity: .85; }
    .dh-sv-name .cx-pill { margin-inline-start: 6px; }

    /* services: proposed grid */
    .dh-sv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .dh-sv-grid > .dh-qa-cell:only-child,
    .dh-sv-grid > .dh-qa-cell:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .dh-sv-grid .dh-qa-m > span { line-height: 1.3; }
</style>
</head>
<body>

<div class="pv-wrap">
    <div class="pv-note">
        <b>معاينة محلية — كل أقسام «جامعتي (قالمة)».</b><br>
        زر <b>قبل / بعد</b> أسفل الشاشة يبدّل بين التصميم القديم والتصميم الموحّد.
        زر الأقسام فوق يعرض كل شاشة كما تظهر داخل التطبيق: القائمة، الرزنامة،
        الموديولات، تفاصيل المقياس، الامتحانات، الغيابات، القاعات، المشرف، التربص،
        المناقشة، الأخبار، التنبيهات، الملف.
        <br><span class="pv-mode" id="modeTag">بعد</span>
    </div>

    <div class="pv-chips" id="chips"></div>

    <section id="section-campus" class="section active" style="padding-bottom:10px">
        <div id="stage"></div>
    </section>
</div>

<div class="pv-toggle">
    <button type="button" id="pv-before">قبل</button>
    <button type="button" id="pv-after" class="on">بعد</button>
</div>

<script>
(function () {
    var S = { view: 'menu', before: false };

    /* ---------------- data ---------------- */
    var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
    var DAY_ICON = ['fa-sun','fa-calendar-day','fa-calendar-day','fa-calendar-day','fa-calendar-check'];
    var SLOTS = ['08:00','09:30','11:00','12:30','14:00'];
    var cells = {
        'الأحد_0': { subject: 'الخوارزميات', type: 'محاضرة', room: 'A2', teacher: 'د. بلقاسم' },
        'الأحد_2': { subject: 'قواعد البيانات', type: 'أعمال موجهة', room: 'B1', teacher: 'د. حمدي' },
        'الاثنين_1': { subject: 'هندسة البرمجيات', type: 'محاضرة', room: 'A1', teacher: 'د. مرابط' }
    };

    /* ---------------- menu ---------------- */
    function featBtn(tab, icon, name, sub) {
        return '<button class="dh-qa-feat pressable" data-go="' + tab + '">' +
            '<span class="dh-sv-ico sx-blue"><i class="fas ' + icon + '"></i></span>' +
            '<span class="dh-qa-m"><span class="dh-qa-fname">' + name + '</span><small>' + sub + '</small></span>' +
            '<i class="fas fa-chevron-left dh-qa-go"></i></button>';
    }
    function cellBtn(tab, icon, name) {
        return '<button class="dh-qa-cell pressable" data-go="' + tab + '">' +
            '<span class="dh-sv-ico sx-blue"><i class="fas ' + icon + '"></i></span>' +
            '<span class="dh-qa-m"><span>' + name + '</span></span></button>';
    }
    function wideBtn(tab, icon, name, sub) {
        return '<button class="dh-qa-wide pressable" data-go="' + tab + '">' +
            '<span class="dh-sv-ico sx-blue"><i class="fas ' + icon + '"></i></span>' +
            '<span class="dh-qa-m"><span class="dh-qa-fname">' + name + '</span><small>' + sub + '</small></span>' +
            '<i class="fas fa-chevron-left dh-qa-go"></i></button>';
    }
    function oldRow(tab, icon, name, badge) {
        return '<button data-go="' + tab + '">' +
            '<span class="dh-sv-ico sx-blue"><i class="fas ' + icon + '"></i></span>' +
            '<span class="dh-sv-name">' + name + (badge ? ' <span class="cx-pill bad">' + badge + '</span>' : '') + '</span>' +
            '<i class="fas fa-chevron-left dh-go"></i></button>';
    }
    function newRow(tab, icon, name, badge) {
        return '<button class="dh-qa-cell pressable" data-go="' + tab + '">' +
            '<span class="dh-sv-ico sx-blue"><i class="fas ' + icon + '"></i></span>' +
            '<span class="dh-qa-m"><span>' + name + (badge ? ' <span class="cx-pill bad">' + badge + '</span>' : '') + '</span></span></button>';
    }
    function svcGroup(items) {
        if (S.before) return '<div class="dh-sv">' + items.map(function (x) { return oldRow(x[0], x[1], x[2], x[3]); }).join('') + '</div>';
        return '<div class="dh-sv-grid">' + items.map(function (x) { return newRow(x[0], x[1], x[2], x[3]); }).join('') + '</div>';
    }

    function menuHTML() {
        return '' +
        '<div class="pm-card" style="margin-top:14px"><h3>مرحباً بعودتك، محمد</h3></div>' +
        '<div class="pm-blue">' +
            '<div style="display:flex;align-items:center;gap:12px">' +
                '<span style="font-size:2rem;opacity:.9"><i class="fas fa-graduation-cap"></i></span>' +
                '<span><span class="pm-muted" style="color:#cdd6ff">تخصصك</span><h2 style="margin:2px 0 0">هندسة البرمجيات</h2></span>' +
            '</div>' +
        '</div>' +
        '<div class="pm-stat4">' +
            '<div class="pm-stat"><i class="fas fa-users" style="color:#34D399"></i><b>دفعة 2 / فوج A</b><span>الدفعة / الفوج</span></div>' +
            '<div class="pm-stat"><i class="fas fa-user-xmark" style="color:#FF7070"></i><b>3</b><span>إجمالي الغيابات</span></div>' +
            '<div class="pm-stat"><i class="fas fa-layer-group" style="color:#60A5FA"></i><b>2</b><span>المستوى</span></div>' +
            '<div class="pm-stat"><i class="fas fa-user-tie" style="color:#FBBF24"></i><b>د. بلقاسم</b><span>أستاذي الوصي</span></div>' +
        '</div>' +
        '<div class="pm-card"><h4><i class="fas fa-chart-line" style="color:#34D399"></i> جدول اليوم</h4>' +
            '<div class="pm-tl">' +
                '<div class="pm-tlrow now"><span class="pm-t">10:00</span> <strong>الخوارزميات</strong><br><span class="pm-muted">محاضرة · القاعة A2</span></div>' +
                '<div class="pm-tlrow"><span class="pm-t">13:30</span> <strong>قواعد البيانات</strong><br><span class="pm-muted">أعمال موجهة · القاعة B1</span></div>' +
            '</div></div>' +
        '<h2 class="dh-minihead" style="margin-inline:14px">وصول سريع</h2>' +
        '<div class="dh-qa" style="padding:0 14px">' +
            featBtn('schedule', 'fa-calendar-week', 'رزنامتي', 'الشبكة الأسبوعية') +
            '<div class="dh-qa-grid">' + cellBtn('modules', 'fa-book', 'موديولاتي') + cellBtn('exams', 'fa-file-pen', 'امتحاناتي') + '</div>' +
            wideBtn('news', 'fa-newspaper', 'الأخبار', 'أخبار الجامعة والإدارة') +
        '</div>' +
        '<section class="dh-sv-sec" style="padding:0 14px">' +
            '<h2 class="dh-minihead">الخدمات</h2>' +
            '<p class="dh-sv-head">النتائج الدراسية</p>' +
            svcGroup([['absences','fa-user-xmark','غياباتي']]) +
            '<p class="dh-sv-head">الحياة الجامعية</p>' +
            svcGroup([['rooms','fa-door-open','القاعات']]) +
            '<p class="dh-sv-head">الملف الجامعي</p>' +
            svcGroup([
                ['tutor','fa-user-tie','المشرف'],
                ['stage','fa-briefcase','التربص'],
                ['defense','fa-graduation-cap','المناقشة'],
                ['notifs','fa-bell','تنبيهاتي', 2],
                ['profile','fa-id-card','ملفي']
            ]) +
        '</section>';
    }

    /* ---------------- schedule ---------------- */
    function scheduleHTML() {
        var picker = '<div class="schedule-day-picker"><div class="day-picker-title">' +
            '<span><i class="fas fa-calendar-day"></i> اختر اليوم</span>' +
            '<button type="button" class="sched-edit-btn"><i class="fas fa-pen"></i> تعديل الجدول</button>' +
            '<button type="button" class="sched-edit-btn"><i class="fas fa-arrows-rotate"></i> مزامنة</button>' +
            '</div><div class="day-picker-grid">' +
            DAYS.map(function (d, i) {
                return '<button class="day-btn ' + (i === 0 ? 'active' : '') + (i < 2 ? ' has-classes' : '') + '"><i class="fas ' + DAY_ICON[i] + '"></i> ' + d + '</button>';
            }).join('') + '</div></div>';
        var slots = '<div class="schedule-mobile-view"><div class="mobile-day-title"><i class="fas fa-calendar-check"></i> جدول الأحد</div>' +
            SLOTS.map(function (t, i) {
                var c = cells['الأحد_' + i];
                var inner = c
                    ? '<strong>' + c.subject + '</strong> <span>' + c.type + '</span><br><i class="fas fa-door-open"></i> ' + c.room + ' · <i class="fas fa-user"></i> ' + c.teacher
                    : '<span class="empty">فارغ</span>';
                var cls = c ? (i === 0 ? 'schedule-cell-lecture' : 'schedule-cell-tdtp') : '';
                return '<div class="mobile-slot"><div class="mobile-slot-time"><i class="fas fa-clock"></i> ' + t + '</div>' +
                    '<div class="mobile-slot-content ' + cls + '">' + inner + '</div></div>';
            }).join('') + '</div>';
        return picker + slots;
    }

    /* ---------------- modules ---------------- */
    function modulesHTML() {
        var mods = [
            { n: 'الخوارزميات وهياكل البيانات', c: 6, k: 3, h: 63, l: 'محاضرة: 45h • أ.م: 9h • أ.ت: 9h' },
            { n: 'قواعد البيانات', c: 5, k: 2, h: 54, l: 'محاضرة: 36h • أ.م: 9h • أ.ت: 9h' },
            { n: 'هندسة البرمجيات', c: 4, k: 2, h: 45, l: 'محاضرة: 27h • أ.م: 9h • أ.ت: 9h' }
        ];
        var tabs = '<div class="pm-tabs"><button class="pm-tab on">السداسي 3</button><button class="pm-tab">السداسي 4</button></div>';
        var cards = mods.map(function (m) {
            return '<div class="pm-card">' +
                '<div style="display:flex;align-items:center;gap:10px">' +
                    '<h3 style="flex:1;margin:0">' + m.n + '</h3>' +
                    '<span style="width:14px;height:14px;border-radius:50%;background:rgba(96,165,250,.25);border:1px solid rgba(96,165,250,.5);flex:0 0 auto"></span>' +
                '</div>' +
                '<div class="pm-mstat">' +
                    '<span><i class="fas fa-star pm-c-blue"></i><b>' + m.c + '</b><span>الرصيد</span></span>' +
                    '<span><i class="fas fa-scale-balanced pm-c-orange"></i><b>' + m.k + '</b><span>المعامل</span></span>' +
                    '<span><i class="fas fa-stopwatch pm-c-purple"></i><b>' + m.h + '</b><span>الحجم الساعي</span></span>' +
                '</div><hr class="pm-hr" />' +
                '<p class="pm-muted" style="text-align:center">' + m.l + '</p>' +
                '<button type="button" class="pm-more">عرض المنهاج</button></div>';
        }).join('');
        return tabs + cards;
    }

    function modDetailHTML() {
        return '<div style="margin:12px 14px"><button type="button" class="pm-goldbtn"><i class="fas fa-arrow-right"></i> العودة للمواد</button></div>' +
        '<div class="pm-blue">' +
            '<span class="pm-ar">AR</span>' +
            '<h2 style="margin:10px 0 4px;font-size:1.5rem">قواعد البيانات</h2>' +
            '<p><i class="fas fa-user"></i> د. حمدي</p>' +
            '<div class="pm-prog"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>التدرج الأسبوعي</span><span>0%</span></div><div class="pm-bar"><i style="width:0%"></i></div></div>' +
        '</div>' +
        '<div class="pm-stat4" style="grid-template-columns:repeat(3,1fr)">' +
            '<div class="pm-stat"><span>الأرصدة</span><b class="pm-c-blue">5</b></div>' +
            '<div class="pm-stat"><span>المعامل</span><b class="pm-c-orange">2</b></div>' +
            '<div class="pm-stat"><span>الحجم الساعي</span><b class="pm-c-teal">54h</b></div>' +
        '</div>' +
        '<div class="pm-card" style="border-inline-end:5px solid #2b3a9e">' +
            '<h4><i class="fas fa-bullseye" style="color:#60A5FA"></i> الأهداف</h4>' +
            '<p class="pm-muted">تمكين الطالب من تصميم قواعد بيانات علائقية، كتابة استعلامات SQL، وفهم التسوية والتوازي.</p>' +
            '<p class="pm-muted">محاضرة: 36h • أعمال موجهة: 9h • أعمال تطبيقية: 9h</p>' +
        '</div>';
    }

    /* ---------------- exams ---------------- */
    function examsHTML() {
        function sec(t, icon, arr, cls) {
            if (!arr.length) return '';
            return '<div class="cx-card"><h4><i class="fas ' + icon + '" style="color:#60A5FA"></i> ' + t + ' <span class="cx-pill ' + cls + '">' + arr.length + '</span></h4>' +
                arr.map(function (x) {
                    return '<div class="cx-room"><span><i class="fas fa-file-pen"></i></span><span><strong>' + x.m + '</strong><br>' +
                        '<span class="cx-muted">' + x.d + ' ' + x.h + ' — قاعة ' + x.r + '</span></span></div>';
                }).join('') + '</div>';
        }
        return sec('الدورة العادية', 'fa-file-lines', [
            { m: 'الخوارزميات', d: '2026-12-14', h: '09:00', r: 'A2' },
            { m: 'قواعد البيانات', d: '2026-12-17', h: '11:00', r: 'B1' }
        ], 'ok') + sec('الاستدراك', 'fa-rotate-right', [
            { m: 'هندسة البرمجيات', d: '2026-12-28', h: '13:30', r: 'C3' }
        ], 'warn');
    }

    /* ---------------- absences ---------------- */
    function absencesHTML() {
        var mods = [
            { n: 'الخوارزميات', t: 4, ju: 2, thr: 3, c: 2, td: 1, tp: 1, det: [
                { d: '2026-11-09', ty: 'محاضرة', j: true },
                { d: '2026-11-16', ty: 'أعمال موجهة', j: false }
            ]},
            { n: 'قواعد البيانات', t: 1, ju: 1, thr: 3, c: 1, td: 0, tp: 0, det: [] }
        ];
        var cards = mods.map(function (m) {
            var un = Math.max(0, m.t - m.ju);
            var risk = un >= m.thr;
            var pill = risk ? '<span class="cx-pill bad">تجاوز العتبة (' + un + '/' + m.thr + ')</span>'
                : '<span class="cx-pill info">' + un + ' غير مبررة / ' + m.thr + '</span>';
            var det = m.det.map(function (x) {
                return '<div class="cx-room"><span><i class="fas ' + (x.j ? 'fa-circle-check' : 'fa-circle-xmark') + '" style="color:' + (x.j ? '#34D399' : '#FF7070') + '"></i></span>' +
                    '<span style="flex:1"><strong>' + x.d + '</strong><br><span class="cx-muted">' + x.ty + '</span></span>' +
                    '<span class="cx-pill ' + (x.j ? 'ok' : 'bad') + '">' + (x.j ? 'مبررة' : 'غير مبررة') + '</span></div>';
            }).join('');
            return '<div class="cx-card"><h4><i class="fas fa-book" style="color:#60A5FA"></i> ' + m.n + '</h4>' +
                '<div class="pm-mstat">' +
                    '<div><i class="fas fa-chalkboard-user pm-c-blue"></i><b>' + m.c + '</b><span>محاضرة</span></div>' +
                    '<div><i class="fas fa-pen-to-square pm-c-teal"></i><b>' + m.td + '</b><span>أعمال موجهة</span></div>' +
                    '<div><i class="fas fa-flask pm-c-purple"></i><b>' + m.tp + '</b><span>أعمال تطبيقية</span></div>' +
                '</div><hr class="pm-hr"><p>المجموع <strong>' + m.t + '</strong> — مبررة <strong>' + m.ju + '</strong> ' + pill + '</p>' + det + '</div>';
        }).join('');
        return '<div class="cx-card"><h4><i class="fas fa-user-xmark" style="color:#60A5FA"></i> الغيابات</h4>' +
            '<p class="cx-muted">المجموع <strong>5</strong> — مبررة <strong>3</strong> — غير مبررة <strong>2</strong> (العتبة القصوى: 3 غير مبررة للمقياس)</p>' +
            '<div class="cx-meter"><i style="width:66%"></i></div></div>' + cards;
    }

    /* ---------------- rooms ---------------- */
    function roomsHTML() {
        var slots = ['08:00', '09:30', '11:00', '12:30'];
        var rooms = [
            { n: 'A1', b: [1, 0, 1, 0] },
            { n: 'A2', b: [1, 1, 0, 0] },
            { n: 'B1', b: [0, 0, 1, 1] }
        ];
        var rows = rooms.map(function (r) {
            return '<tr><td>' + r.n + '</td>' + r.b.map(function (b) {
                return '<td><span class="' + (b ? 'pm-cellbusy' : 'pm-cellok') + '" title="' + (b ? 'مشغولة' : 'حرة') + '"><i class="fas ' + (b ? 'fa-user-group' : 'fa-check') + '"></i></span></td>';
            }).join('') + '</tr>';
        }).join('');
        return '<div class="pm-roomhead"><h3>شغور القاعات</h3>' +
            '<select class="pm-day"><option>الأحد</option><option>الاثنين</option></select></div>' +
            '<div class="pm-search"><input placeholder="ابحث عن اسم القاعة..." /><i class="fas fa-magnifying-glass"></i></div>' +
            '<div class="pm-twrap"><table class="pm-rooms"><thead><tr><th>القاعة</th>' +
            slots.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '<div class="pm-pager"><button disabled><i class="fas fa-chevron-right"></i></button><span>Page 1 / 1</span><button disabled><i class="fas fa-chevron-left"></i></button></div>';
    }

    /* ---------------- tutor ---------------- */
    function tutorHTML() {
        return '<div class="cx-card"><h4><i class="fas fa-user-tie" style="color:#60A5FA"></i> مشرفي</h4>' +
            '<p style="font-size:1.15rem;font-weight:800">د. بلقاسم</p><p class="cx-muted">B. Belkacem</p></div>' +
            '<div class="cx-card"><h4>السجل</h4><p>• جلسة إرشاد — 2026-10-12</p><p>• متابعة المشروع — 2026-11-03</p></div>';
    }

    /* ---------------- stage ---------------- */
    function stageHTML() {
        return '<div class="cx-card"><h4><i class="fas fa-briefcase" style="color:#60A5FA"></i> التربص</h4>' +
            '<p><span class="cx-pill ok">الترشح مفتوح</span></p>' +
            '<div class="cx-room"><span><i class="fas fa-briefcase"></i></span><span><strong>تطوير منصة إدارة المخابر</strong><br>' +
            '<span class="cx-muted">قيد الدراسة 2026-11-01</span></span></div></div>';
    }

    /* ---------------- defense ---------------- */
    function defenseHTML() {
        return '<div class="cx-card"><h4><i class="fas fa-graduation-cap" style="color:#60A5FA"></i> المناقشة</h4>' +
            '<p>2027-06-15 — القاعة الكبرى</p><h4>اللجنة</h4>' +
            '<div class="cx-room"><span><i class="fas fa-scale-balanced"></i></span><span><strong>الرئيس:</strong> د. مرابط</span></div>' +
            '<div class="cx-room"><span><i class="fas fa-scale-balanced"></i></span><span><strong>المشرف:</strong> د. بلقاسم</span></div></div>';
    }

    /* ---------------- news ---------------- */
    function newsHTML() {
        var card = '<div class="pm-card"><h4><i class="fas fa-landmark" style="color:#60A5FA"></i> إعلانات الكلية <span class="cx-pill info">مباشر</span></h4>' +
            '<div class="cx-room"><span><i class="fas fa-landmark" style="color:#60A5FA;font-size:.7rem"></i></span><span><strong>فتح التسجيلات للسداسي الثاني</strong><br><span class="cx-muted">2026-11-18 09:00</span></span></div></div>';
        var ticker = '<div class="pm-ticker"><span class="pm-bolt"><i class="fas fa-bolt"></i></span><div class="pm-track"><span>تذكير: آخر أجل لدفع حقوق التسجيل 30 نوفمبر • نتائج الامتحانات الاستدراكية متاحة الآن</span></div></div>';
        var search = '<div class="pm-search"><input placeholder="البحث في الأخبار..." /><i class="fas fa-magnifying-glass"></i></div>';
        var news = [
            { d: '2026-11-17', tag: '<span class="pm-tag pink">رئاسة الجامعة</span>', t: 'انطلاق الأسبوع العلمي للكلية', x: 'تنظم كلية الرياضيات والإعلام الآلي الأسبوع العلمي الأول حول الذكاء الاصطناعي التطبيقي، بمشاركة أساتذة وباحثين من عدة جامعات.' },
            { d: '2026-11-15', tag: '<span class="pm-tag teal">القسم</span>', t: 'جدول الامتحانات النهائية', x: 'نشر القسم الجدول الرسمي لامتحانات السداسي الثالث، مع التنبيه بضرورة الحضور قبل الموعد بنصف ساعة.' }
        ].map(function (n) {
            return '<div class="pm-card pm-news"><div class="pm-top"><span class="pm-date">' + n.d + '</span>' + n.tag + '</div>' +
                '<h3>' + n.t + '</h3><p class="pm-x">' + n.x + '</p>' +
                '<button type="button" class="pm-more">عرض التفاصيل</button></div>';
        }).join('');
        var pager = '<div class="pm-pager"><button disabled><i class="fas fa-chevron-right"></i></button><span>Page 1 / 2</span><button><i class="fas fa-chevron-left"></i></button></div>';
        return card + ticker + search + news + pager;
    }

    /* ---------------- notifs ---------------- */
    function notifsHTML() {
        var list = [
            { un: true, t: 'تغيير قاعة امتحان الخوارزميات', s: 'إدارة القسم', d: '2026-11-18', x: 'نُقل امتحان الخوارزميات إلى القاعة A2 بدل A1.' },
            { un: false, t: 'تذكير بدفع حقوق التسجيل', s: 'الأمانة العامة', d: '2026-11-10', x: 'آخر أجل هو 30 نوفمبر 2026.' }
        ];
        return '<div class="cx-card"><h4><i class="fas fa-bell" style="color:#60A5FA"></i> تنبيهاتي <span class="cx-pill info">2</span></h4>' +
            list.map(function (x) {
                return '<div class="cx-room"><span><i class="fas ' + (x.un ? 'fa-circle' : 'fa-circle-notch') + '" style="color:' + (x.un ? '#60A5FA' : '#8A93A6') + ';font-size:.6rem"></i></span>' +
                    '<span><strong>' + x.t + '</strong><br><span class="cx-muted">' + x.s + ' — ' + x.d + '</span><br>' + x.x + '</span></div>';
            }).join('') + '</div>';
    }

    /* ---------------- profile ---------------- */
    function profileHTML() {
        function row(k, v) {
            return '<div class="cx-room"><span class="cx-muted" style="min-width:110px">' + k + '</span><strong>' + v + '</strong></div>';
        }
        return '<div class="cx-card"><h4><i class="fas fa-id-card" style="color:#60A5FA"></i> ملفي الجامعي</h4>' +
            row('الاسم', 'محمد بن علي') + row('Matricule', '202312345') + row('التسجيل', '2023/2024') +
            row('البكالوريا', '2023 — تقني رياضي') + row('الميلاد', '2005-04-12') +
            row('الهاتف', '0550 12 34 56') + row('البريد', 'mohamed@example.dz') + row('القسم/الفوج', 'هندسة البرمجيات / A') +
            '<p style="margin-top:12px"><button type="button" class="cx-btn gold"><i class="fas fa-rotate-right"></i> تحديث الملف</button></p>' +
            '<p class="cx-muted">قانون 18-07: بياناتك لا تغادر جهازك وسيرفر الجامعة.</p></div>';
    }

    /* ---------------- router ---------------- */
    var VIEWS = {
        menu: menuHTML,
        schedule: scheduleHTML,
        modules: modulesHTML,
        moddetail: modDetailHTML,
        exams: examsHTML,
        absences: absencesHTML,
        rooms: roomsHTML,
        tutor: tutorHTML,
        stage: stageHTML,
        defense: defenseHTML,
        news: newsHTML,
        notifs: notifsHTML,
        profile: profileHTML
    };
    var LABELS = {
        menu: 'القائمة', schedule: 'الرزنامة', modules: 'الموديولات', moddetail: 'تفاصيل مقياس',
        exams: 'الامتحانات', absences: 'الغيابات', rooms: 'القاعات', tutor: 'المشرف',
        stage: 'التربص', defense: 'المناقشة', news: 'الأخبار', notifs: 'التنبيهات', profile: 'الملف'
    };

    var stage = document.getElementById('stage');
    var chips = document.getElementById('chips');
    Object.keys(VIEWS).forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = LABELS[k];
        b.dataset.view = k;
        if (k === S.view) b.className = 'on';
        chips.appendChild(b);
    });

    function backBar() {
        return '<button type="button" class="cx-back pressable" data-go="menu"><i class="fas fa-chevron-right"></i> الأقسام</button>';
    }

    function paint() {
        var html = VIEWS[S.view]();
        stage.innerHTML = (S.view === 'menu' ? '' : backBar()) + '<div id="pms-body">' + html + '</div>';
        Array.prototype.forEach.call(chips.children, function (b) {
            b.classList.toggle('on', b.dataset.view === S.view);
        });
        document.getElementById('modeTag').textContent = S.before ? 'قبل' : 'بعد';
        document.getElementById('pv-before').classList.toggle('on', S.before);
        document.getElementById('pv-after').classList.toggle('on', !S.before);
        document.body.classList.toggle('before', S.before);
    }

    chips.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-view]');
        if (!b) return;
        S.view = b.dataset.view;
        paint();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    stage.addEventListener('click', function (e) {
        var b = e.target.closest('[data-go]');
        if (!b) return;
        S.view = b.dataset.go;
        paint();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('pv-before').addEventListener('click', function () { S.before = true; paint(); });
    document.getElementById('pv-after').addEventListener('click', function () { S.before = false; paint(); });

    paint();
})();
</script>
</body>
</html>
