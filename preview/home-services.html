<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — الرئيسية: الخدمات وترحيب أهلًا بك</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css?v=pv5">
<link rel="stylesheet" href="../css/luxury.css?v=pv5">
<link rel="stylesheet" href="../css/auth.css?v=pv5">
<link rel="stylesheet" href="../css/native.css?v=pv5">
<link rel="stylesheet" href="../css/campus.css?v=pv5">
<link rel="stylesheet" href="../css/nova.css?v=pv5">
<style>
    /* preview chrome only — not part of the app */
    html, body { margin: 0; }
    .pv-wrap { max-width: 560px; margin: 0 auto; padding-bottom: 120px; }
    .pv-note {
        margin: 18px 14px 0; padding: 14px 18px; color: #94A3B8;
        font-family: 'Tajawal', sans-serif; font-size: 13px; line-height: 1.8;
        background: #131927; border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
    }
    .pv-note b { color: #fff; }
    .pv-toggle {
        position: fixed; z-index: 99999; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px; border-radius: 999px;
        background: rgba(19,25,39,.92); border: 1px solid rgba(255,255,255,.12);
        box-shadow: 0 16px 40px rgba(0,0,0,.55); backdrop-filter: blur(14px);
        font-family: 'Tajawal', sans-serif;
    }
    .pv-toggle button {
        border: 0; cursor: pointer; padding: 9px 22px; border-radius: 999px;
        background: transparent; color: #94A3B8; font: inherit; font-weight: 800; font-size: 13px;
    }
    .pv-toggle button.on { background: linear-gradient(135deg, #3B82F6, #2563EB); color: #fff; }
    .pv-mode { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(59,130,246,.15); color: #93C5FD; }

    /* ================= BEFORE (shipped 1.4.66 look) — scoped ================= */
    body.pv-before #section-home .dh-greet {
        padding: 14px 16px !important; gap: 14px !important;
        background: #131927 !important;
        border: 1px solid rgba(255,255,255,.08) !important;
        border-radius: 18px !important;
        box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.22) !important;
    }
    body.pv-before #section-home .dh-seal {
        width: 46px !important; height: 46px !important; border-radius: 14px !important;
        color: #fff !important; background: transparent !important;
        border: 0 !important; box-shadow: none !important;
    }
    body.pv-before #dh-who { font-size: 1.42rem !important; line-height: 1.3 !important; color: #fff !important; }
    body.pv-before #dia-switch {
        display: flex !important; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    body.pv-before .dia-chip {
        padding: 6px 12px; border-radius: 999px; font-size: .72rem; font-weight: 800;
        background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #94A3B8;
    }
    body.pv-before .dia-chip.sel { background: #0B0E14; color: #fff; border-color: #0B0E14; }

    body.pv-before #section-home .dh-sv {
        background: #131927 !important;
        border: 1px solid rgba(255,255,255,.08) !important;
        border-radius: 16px !important;
        box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.22) !important;
    }
    body.pv-before #section-home .dh-sv-row {
        background: transparent !important;
        border: 0 !important;
        border-radius: 10px !important;
        box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.22) !important;
    }
    body.pv-before #section-home .dh-sv .dh-sv-name { color: #fff !important; font-size: .88rem !important; }
    body.pv-before #section-home .dh-sv .dh-go { color: #8A93A6 !important; }
</style>
</head>
<body>

<div class="pv-wrap">
    <div class="pv-note">
        <b>معاينة محلية — الرئيسية فقط.</b> زر <b>قبل / بعد</b> أسفل الشاشة يبدّل بين الشكل الحالي والشكل المقترح.
        التغيير في <b>الألوان والهالة وشكل الخانة</b> فقط: الترتيب، عدد الخانات، المسافات،
        ووصول سريع فوقها كلها باقية كما هي.
        <br><span class="pv-mode" id="modeTag">بعد</span>
    </div>

    <main class="main-content">
    <section id="section-home" class="section active">
        <div class="dh-wrap">
            <header class="dh-greet">
                <div class="dh-seal"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,9 58,21 32,33 6,21" fill="#D9A93F"/><path d="M22 27.5v6.8c0 5.2 20 5.2 20 0v-6.8l-10 4.2z" fill="currentColor"/><rect x="54.8" y="21" width="2.6" height="14.5" rx="1.3" fill="#A87B22"/><circle cx="56.1" cy="38.2" r="3.1" fill="#A87B22"/><path d="M10 43.5c7-3.6 15-3.6 22 0 7-3.6 15-3.6 22 0v9.5c-7-3.6-15-3.6-22 0-7-3.6-15-3.6-22 0z" fill="currentColor"/><path d="M32 43.5v9.5" stroke="#A87B22" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg></div>
                <h1 class="dh-who" id="dh-who">أهلًا، محمد</h1>
                <div id="dia-switch" class="dia-switch"><button type="button" class="dia-chip sel">2026/2027</button><button type="button" class="dia-chip">2025/2026</button></div>
            </header>

            <section aria-label="وصول سريع">
                <h2 class="dh-minihead">وصول سريع</h2>
                <div class="dh-qa">
                    <button class="dh-qa-feat pressable" aria-label="كشف النقاط">
                        <span class="dh-sv-ico sx-gold"><i class="fas fa-file-lines"></i></span>
                        <span class="dh-qa-m"><span class="dh-qa-fname">كشف النقاط</span><small>النقاط والمعدلات</small></span>
                        <i class="fas fa-chevron-left dh-qa-go"></i>
                    </button>
                    <div class="dh-qa-grid">
                        <button class="dh-qa-cell pressable" aria-label="الرزنامة">
                            <span class="dh-sv-ico sx-blue"><i class="fas fa-calendar-week"></i></span>
                            <span class="dh-qa-m"><span>الرزنامة</span></span>
                        </button>
                        <button class="dh-qa-cell pressable" aria-label="بطاقة الطالب">
                            <span class="dh-sv-ico sx-gold"><i class="fas fa-id-card"></i></span>
                            <span class="dh-qa-m"><span>بطاقة الطالب</span></span>
                        </button>
                    </div>
                    <button class="dh-qa-wide pressable" aria-label="المكتبة">
                        <span class="dh-sv-ico sx-gold"><i class="fas fa-book-open"></i></span>
                        <span class="dh-qa-m"><span class="dh-qa-fname">المكتبة</span><small>مكتبة رقمية</small></span>
                        <i class="fas fa-chevron-left dh-qa-go"></i>
                    </button>
                </div>
            </section>

            <section class="dh-sv-sec" aria-label="الخدمات">
                <h2 class="dh-minihead">الخدمات</h2>
                <p class="dh-sv-head">النتائج الدراسية</p>
                <div class="dh-sv">
                    <button class="dh-sv-row pressable" aria-label="علامات الامتحانات"><span class="dh-sv-ico sx-gold"><i class="fas fa-clipboard-check"></i></span><span class="dh-sv-name">علامات الامتحانات</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="التقييم المستمر"><span class="dh-sv-ico sx-blue"><i class="fas fa-pen-ruler"></i></span><span class="dh-sv-name">التقييم المستمر</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="حاسبة المعدل"><span class="dh-sv-ico sx-gold"><i class="fas fa-calculator"></i></span><span class="dh-sv-name">حاسبة المعدل</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="الديون"><span class="dh-sv-ico sx-gold"><i class="fas fa-file-invoice-dollar"></i></span><span class="dh-sv-name">الديون</span><i class="fas fa-chevron-left dh-go"></i></button>
                </div>
                <p class="dh-sv-head">الحياة الجامعية</p>
                <div class="dh-sv">
                    <button class="dh-sv-row pressable" aria-label="الوجبات"><span class="dh-sv-ico sx-green"><i class="fas fa-utensils"></i></span><span class="dh-sv-name">الوجبات</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="النقل الحي"><span class="dh-sv-ico sx-blue"><i class="fas fa-bus"></i></span><span class="dh-sv-name">النقل الحي</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="الامتحانات"><span class="dh-sv-ico sx-amber"><i class="fas fa-calendar-days"></i></span><span class="dh-sv-name">الامتحانات</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="النسب المئوية للمقاييس"><span class="dh-sv-ico sx-blue"><i class="fas fa-percent"></i></span><span class="dh-sv-name">النسب المئوية للمقاييس</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="جامعتي قالمة"><span class="dh-sv-ico sx-gold"><i class="fas fa-building-columns"></i></span><span class="dh-sv-name">جامعتي (قالمة)</span><i class="fas fa-chevron-left dh-go"></i></button>
                </div>
                <p class="dh-sv-head">الملف الجامعي</p>
                <div class="dh-sv">
                    <button class="dh-sv-row pressable" aria-label="ملفي الشامل"><span class="dh-sv-ico sx-blue"><i class="fas fa-id-badge"></i></span><span class="dh-sv-name">ملفي الشامل</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="تسجيلاتي"><span class="dh-sv-ico sx-gold"><i class="fas fa-clipboard-list"></i></span><span class="dh-sv-name">تسجيلاتي</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="المجموعة والفوج"><span class="dh-sv-ico sx-blue"><i class="fas fa-users"></i></span><span class="dh-sv-name">المجموعة والفوج</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="العطلة الأكاديمية"><span class="dh-sv-ico sx-green"><i class="fas fa-plane-departure"></i></span><span class="dh-sv-name">العطلة الأكاديمية</span><i class="fas fa-chevron-left dh-go"></i></button>
                    <button class="dh-sv-row pressable" aria-label="لوحة التحكم"><span class="dh-sv-ico sx-neutral"><i class="fas fa-cog"></i></span><span class="dh-sv-name">لوحة التحكم</span><i class="fas fa-chevron-left dh-go"></i></button>
                </div>
            </section>
        </div>
    </section>
    </main>
</div>

<div class="pv-toggle">
    <button type="button" id="pv-before">قبل</button>
    <button type="button" id="pv-after" class="on">بعد</button>
</div>

<script>
(function () {
    var before = document.getElementById('pv-before');
    var after = document.getElementById('pv-after');
    var tag = document.getElementById('modeTag');
    function set(toBefore) {
        document.body.classList.toggle('pv-before', toBefore);
        before.classList.toggle('on', toBefore);
        after.classList.toggle('on', !toBefore);
        tag.textContent = toBefore ? 'قبل' : 'بعد';
    }
    before.addEventListener('click', function () { set(true); });
    after.addEventListener('click', function () { set(false); });
})();
</script>
</body>
</html>
