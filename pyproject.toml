[tool.poetry]
name = "university-portal"
version = "0.1.0"
description = "University Study Portal"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
flask = "3.0.0"
flask-sqlalchemy = "3.1.1"
flask-cors = "4.0.0"
gunicorn = "21.2.0"
psycopg2-binary = "2.9.9"
python-telegram-bot = "20.7"
bcrypt = "4.2.1"
httpx = "0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
